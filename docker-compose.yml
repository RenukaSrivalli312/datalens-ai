version: "3.9"

services:

  backend:
    build: ./server
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:5001
    depends_on:
      - backend

volumes:
  backend-uploads: